<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In · Gradient</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Alegreya+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary:     #0B0F14;
      --bg-secondary:   #121820;
      --surface:        #1A2332;
      --border:         #2A3647;
      --accent:         #186275;
      --accent-hover:   #1d7a91;
      --accent-glow:    rgba(24, 98, 117, 0.35);
      --text-primary:   #EDEDED;
      --text-secondary: #5B7797;
      --text-muted:     #8295B0;
      --error-bg:       rgba(200, 60, 60, 0.07);
      --error-border:   rgba(200, 60, 60, 0.4);
      --error-text:     #e89090;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Alegreya Sans', sans-serif;
      font-weight: 400;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
    }

    /* Radial glow */
    body::before {
      content: '';
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(500px, 70vw, 900px);
      height: clamp(300px, 40vh, 450px);
      background: radial-gradient(ellipse at center, rgba(24, 98, 117, 0.18), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Logo ── */
    .logo-wrap {
      position: fixed;
      top: clamp(24px, 4vw, 40px);
      left: clamp(24px, 4vw, 40px);
      z-index: 100;
      display: flex;
      align-items: center;
    }

    .logo-wrap img {
      height: clamp(32px, 5vw, 40px);
      width: auto;
      display: block;
    }

    /* ── Main ── */
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(80px, 12vh, 140px) clamp(24px, 5vw, 48px) clamp(100px, 14vh, 160px);
    }

    /* ── Card ── */
    .card {
      width: min(460px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: clamp(40px, 6vw, 52px) clamp(36px, 6vw, 48px);
      box-shadow:
        0 0 0 1px rgba(24, 98, 117, 0.08),
        0 32px 80px rgba(0, 0, 0, 0.6);
    }

    .card-rule {
      width: 40px;
      height: 3px;
      border-radius: 2px;
      background: var(--accent);
      margin-bottom: 24px;
    }

    .card h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 3vw, 2rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .card .subtitle {
      font-size: 0.9rem;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 28px;
    }

    /* ── Form ── */
    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 20px;
    }

    .field label {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .field input {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      font-family: 'Alegreya Sans', sans-serif;
      font-size: 1rem;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      width: 100%;
    }

    .field input::placeholder {
      color: var(--text-secondary);
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(24, 98, 117, 0.2);
    }

    /* ── Error banner ── */
    .error-banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .error-icon {
      flex-shrink: 0;
      margin-top: 1px;
      width: 16px;
      height: 16px;
      stroke: var(--error-text);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Button ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px 24px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-family: 'Alegreya Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn:hover {
      background: var(--accent-hover);
      box-shadow: 0 6px 28px var(--accent-glow);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      padding: clamp(24px, 4vw, 40px);
      gap: 16px;
    }

    .footer-copy {
      grid-column: 1;
      justify-self: start;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .footer-craft {
      grid-column: 2;
      justify-self: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      footer {
        grid-template-columns: 1fr;
        gap: 12px;
        text-align: center;
      }

      .footer-copy {
        grid-column: 1;
        grid-row: 2;
        justify-self: center;
      }

      .footer-craft {
        grid-column: 1;
        grid-row: 1;
        justify-self: center;
      }
    }

    @media (max-width: 480px) {
      main {
        padding: clamp(60px, 10vh, 100px) 20px clamp(80px, 12vh, 120px);
      }

      .card {
        padding: 32px 24px;
      }

      footer {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- Logo -->
  <a class="logo-wrap" href="/">
    <img src="/static/logo.png" alt="Gradient Logo" onerror="this.style.display='none'">
  </a>

  <main>
    <div class="card">
      <div class="card-rule"></div>
      <h1>Sign In</h1>
      <p class="subtitle">Gradient Internal Tools</p>

      <div class="divider"></div>

      {% if error %}
      <div class="error-banner" role="alert">
        <svg class="error-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            name="email"
            placeholder="you@gradientclub.in"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="btn" type="submit">Sign In</button>
      </form>
    </div>
  </main>

  <footer>
    <p class="footer-copy">© 2026 · GradientClub.in</p>
    <p class="footer-craft">Crafted by Gradient Club</p>
  </footer>

</body>
</html>
