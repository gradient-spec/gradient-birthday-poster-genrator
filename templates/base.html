<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gradient Birthday Poster Generator{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Alegreya+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">

  <style>
    /* ─────────────────────────────────────────
       DESIGN TOKENS
    ───────────────────────────────────────── */
    :root {
      --bg:            #0B0F14;
      --bg-secondary:  #121820;
      --surface:       #1A2332;
      --border:        #2A3647;
      --accent:        #186275;
      --accent-hover:  #1d7a91;
      --accent-glow:   rgba(24, 98, 117, 0.32);
      --accent2:       #24015C;
      --glow:          #A4CBEB;
      --text:          #EDEDED;
      --text-secondary:#5B7797;
      --text-muted:    #8295B0;
      --success-bg:    rgba(24, 98, 117, 0.10);
      --success-border:rgba(24, 98, 117, 0.45);
      --success-text:  #7ecfdf;
      --error-bg:      rgba(200, 60, 60, 0.07);
      --error-border:  rgba(200, 60, 60, 0.40);
      --error-text:    #e89090;
      --sidebar-w:     240px;
      --topbar-h:      56px;
      --radius:        12px;
      --font-heading:  'Playfair Display', Georgia, serif;
      --font-body:     'Alegreya Sans', system-ui, sans-serif;
    }

    /* ─────────────────────────────────────────
       RESET
    ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      height: 100%;
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: var(--font-body); cursor: pointer; }
    svg { display: block; }

    /* ─────────────────────────────────────────
       APP SHELL
    ───────────────────────────────────────── */
    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-rows: 1fr;
      min-height: 100vh;
    }

    /* ─────────────────────────────────────────
       SIDEBAR
    ───────────────────────────────────────── */
    .sidebar {
      grid-column: 1;
      grid-row: 1;
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-w);
      height: 100vh;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 200;
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* brand */
    .sidebar-brand {
      padding: 24px 20px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .sidebar-brand img {
      height: 30px;
      width: auto;
      flex-shrink: 0;
    }
    .sidebar-brand-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .sidebar-brand-name {
      font-family: var(--font-heading);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar-brand-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* nav */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar-nav-label {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 8px 8px 4px;
      margin-top: 4px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 0.92rem;
      font-weight: 400;
      transition: background 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }
    .nav-item svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-item:hover {
      background: rgba(255,255,255,0.05);
      color: var(--text);
    }
    .nav-item.active {
      background: rgba(24, 98, 117, 0.14);
      color: var(--success-text);
    }
    .nav-item.active svg {
      stroke: var(--success-text);
    }

    /* sidebar bottom */
    .sidebar-footer {
      padding: 16px 12px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-user {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    .sidebar-user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 600;
      color: #fff;
      flex-shrink: 0;
    }
    .sidebar-user-email {
      font-size: 0.78rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .btn-logout {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.88rem;
      font-weight: 400;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .btn-logout svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .btn-logout:hover {
      background: rgba(200, 60, 60, 0.08);
      color: var(--error-text);
    }

    /* ─────────────────────────────────────────
       MOBILE TOPBAR
    ───────────────────────────────────────── */
    .topbar {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--topbar-h);
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 300;
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topbar-brand img {
      height: 26px;
      width: auto;
    }
    .topbar-brand-name {
      font-family: var(--font-heading);
      font-size: 0.9rem;
      font-weight: 600;
    }
    .hamburger {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 36px;
      height: 36px;
      background: transparent;
      border: none;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .hamburger span {
      display: block;
      width: 100%;
      height: 1.5px;
      background: var(--text-muted);
      border-radius: 2px;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .hamburger:hover { background: rgba(255,255,255,0.06); }

    /* sidebar overlay (mobile) */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 190;
    }
    .sidebar-overlay.active { display: block; }

    /* ─────────────────────────────────────────
       MAIN CONTENT
    ───────────────────────────────────────── */
    .main {
      grid-column: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      /* subtle top glow */
      background-image: radial-gradient(ellipse 60% 30% at 60% -5%, rgba(24,98,117,0.12), transparent);
    }

    .page-content {
      flex: 1;
      padding: clamp(32px, 4vw, 48px) clamp(24px, 4vw, 48px);
      max-width: 1000px;
      width: 100%;
    }

    /* page header */
    .page-header {
      margin-bottom: 32px;
    }
    .page-header h1 {
      font-family: var(--font-heading);
      font-size: clamp(1.6rem, 2.5vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 4px;
    }
    .page-header .page-date {
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    .page-divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 32px;
    }

    /* ─────────────────────────────────────────
       SHARED COMPONENTS
    ───────────────────────────────────────── */

    /* card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    /* primary button */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border: none;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    .btn-primary svg {
      width: 16px; height: 16px;
      stroke: currentColor; fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
      flex-shrink: 0;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 6px 24px var(--accent-glow);
      transform: translateY(-1px);
    }
    .btn-primary:active { transform: translateY(0); }

    /* status pill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #4ade80;
      letter-spacing: 0.04em;
    }
    .status-pill span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 5px rgba(74,222,128,0.6);
      flex-shrink: 0;
    }

    /* message banner */
    .message-banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 13px 16px;
      border-radius: 10px;
      font-size: 0.92rem;
      line-height: 1.55;
      margin-top: 20px;
    }
    .message-banner.success {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }
    .message-banner.neutral {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .message-banner.error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }
    .message-banner svg {
      width: 15px; height: 15px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      flex-shrink: 0; margin-top: 1px;
    }

    /* ─────────────────────────────────────────
       RESPONSIVE
    ───────────────────────────────────────── */
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }

      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
        box-shadow: 4px 0 32px rgba(0,0,0,0.5);
      }

      .topbar { display: flex; }

      .main {
        grid-column: 1;
        padding-top: var(--topbar-h);
      }
    }

    @media (max-width: 480px) {
      .page-content {
        padding: 24px 16px;
      }
    }
  </style>
</head>
<body>

<!-- ── Mobile topbar ── -->
<div class="topbar" id="topbar">
  <div class="topbar-brand">
    <img src="/static/logo.png" alt="Gradient" onerror="this.style.display='none'">
    <span class="topbar-brand-name">Gradient</span>
  </div>
  <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
    <span></span><span></span><span></span>
  </button>
</div>

<!-- ── Sidebar overlay (mobile) ── -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-brand">
      <img src="/static/logo.png" alt="Gradient" onerror="this.style.display='none'">
      <div class="sidebar-brand-text">
        <span class="sidebar-brand-name">Gradient</span>
        <span class="sidebar-brand-sub">Birthday Platform</span>
      </div>
    </div>

    <nav class="sidebar-nav" aria-label="Main navigation">
      <span class="sidebar-nav-label">Navigation</span>
      <a href="/" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a href="/members" class="nav-item {% if active_page == 'members' %}active{% endif %}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Members
      </a>
      <a href="/history" class="nav-item {% if active_page == 'history' %}active{% endif %}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 1 .5 4M3 21v-4h4"/></svg>
        History
      </a>
      <a href="/templates" class="nav-item {% if active_page == 'templates' %}active{% endif %}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Templates
      </a>
      <a href="/settings" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </a>
    </nav>

    <div class="sidebar-footer">
      {% if user %}
      <div class="sidebar-user">
        <div class="sidebar-user-avatar">{{ user[0]|upper }}</div>
        <span class="sidebar-user-email">{{ user }}</span>
      </div>
      {% endif %}
      <form method="post" action="/logout">
        <button class="btn-logout" type="submit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign out
        </button>
      </form>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="main" id="main-content">
    <div class="page-content">
      {% block content %}{% endblock %}
    </div>
  </main>

</div><!-- /.app -->

<script>
  (function () {
    const sidebar  = document.getElementById('sidebar');
    const overlay  = document.getElementById('sidebar-overlay');
    const hamburger = document.getElementById('hamburger');

    function openSidebar() {
      sidebar.classList.add('open');
      overlay.classList.add('active');
      hamburger.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
    }
    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
      hamburger.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }

    hamburger.addEventListener('click', function () {
      sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
    });
    overlay.addEventListener('click', closeSidebar);

    // close on Escape
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeSidebar();
    });
  })();
</script>

<!-- ══════════════════════════════════════════════════════════════════════════
     GLOBAL FETCH RECOVERY — Intercepts all fetch() calls
     Automatically redirects to the loader page if backend is unreachable
     ══════════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  /* ────────────────────────────────────────────────────────────────────────
     CONFIG
     Change these URLs to match your deployment.
     ──────────────────────────────────────────────────────────────────────── */
  var LOADER_URL = 'https://birthday-posters.gradientclub.in';
  var BACKEND_URL = 'https://birthday-api.gradientclub.in';

  /* ────────────────────────────────────────────────────────────────────────
     REDIRECT GUARD
     Prevent infinite loops if redirect fails repeatedly.
     Clear after 10 seconds so legitimate retries work.
     ──────────────────────────────────────────────────────────────────────── */
  var redirectInProgress = false;
  var redirectKey = '__gradient_redirect_in_progress';

  function canRedirect() {
    var ts = sessionStorage.getItem(redirectKey);
    if (!ts) return true;
    var elapsed = Date.now() - parseInt(ts, 10);
    // If more than 10 seconds since last redirect, allow retry
    return elapsed > 10000;
  }

  function markRedirect() {
    redirectInProgress = true;
    sessionStorage.setItem(redirectKey, String(Date.now()));
  }

  function clearRedirectMark() {
    sessionStorage.removeItem(redirectKey);
  }

  /* ────────────────────────────────────────────────────────────────────────
     REDIRECT TO LOADER
     Saves current page URL in sessionStorage so the loader can restore it
     after the backend wakes up (if possible).
     ──────────────────────────────────────────────────────────────────────── */
  function redirectToLoader() {
    if (redirectInProgress || !canRedirect()) {
      console.warn('[Recovery] Redirect already in progress or too recent.');
      return;
    }

    markRedirect();

    // Save current page so loader can restore it after wake-up
    // Only save if it's a valid Flask route (not /login, not error pages)
    var path = window.location.pathname;
    if (path && path !== '/login' && path !== '/loading' && !path.startsWith('/api')) {
      sessionStorage.setItem('__gradient_return_path', path);
    } else {
      sessionStorage.removeItem('__gradient_return_path');
    }

    console.log('[Recovery] Backend unreachable. Redirecting to loader:', LOADER_URL);
    window.location.href = LOADER_URL;
  }

  /* ────────────────────────────────────────────────────────────────────────
     ERROR DETECTOR
     Returns true if the error indicates the backend is asleep or unreachable.
     ──────────────────────────────────────────────────────────────────────── */
  function isBackendAsleep(response, error) {
    // Network-level failures (fetch threw an exception)
    if (error) {
      var msg = error.message || String(error);
      // Common fetch error patterns
      if (msg.includes('Failed to fetch')) return true;
      if (msg.includes('NetworkError')) return true;
      if (msg.includes('Network request failed')) return true;
      if (msg.includes('Load failed')) return true;
      if (msg.includes('ECONNREFUSED')) return true;
      if (msg.includes('ENOTFOUND')) return true;
      if (msg.includes('ERR_CONNECTION_REFUSED')) return true;
      if (msg.includes('ERR_NAME_NOT_RESOLVED')) return true;
      if (msg.includes('The operation couldn't be completed')) return true;
    }

    // HTTP-level failures (response received but indicates server issues)
    if (response) {
      var status = response.status;
      // 502 Bad Gateway: reverse proxy can't reach backend
      // 503 Service Unavailable: server overloaded or cold-starting
      // 504 Gateway Timeout: backend took too long to respond
      if (status === 502 || status === 503 || status === 504) return true;
    }

    return false;
  }

  /* ────────────────────────────────────────────────────────────────────────
     FETCH INTERCEPTOR
     Wraps native fetch() to catch failures and redirect automatically.
     ──────────────────────────────────────────────────────────────────────── */
  var nativeFetch = window.fetch;

  window.fetch = function (url, options) {
    // Only intercept calls to our backend
    var urlStr = String(url);
    var isBackendCall = urlStr.startsWith(BACKEND_URL) || 
                        urlStr.startsWith('/api/') || 
                        urlStr.startsWith('/') && !urlStr.startsWith('//');

    if (!isBackendCall) {
      // External fetch (fonts, CDN, etc.) — pass through untouched
      return nativeFetch.apply(this, arguments);
    }

    // Wrap the fetch promise to catch errors
    return nativeFetch.apply(this, arguments)
      .then(function (response) {
        // Check if response indicates backend is asleep
        if (isBackendAsleep(response, null)) {
          console.error('[Recovery] Backend asleep (HTTP ' + response.status + '). Redirecting to loader.');
          redirectToLoader();
          // Return a rejected promise so caller's .catch() doesn't execute twice
          return Promise.reject(new Error('Backend asleep, redirecting to loader'));
        }

        // Response is fine — clear redirect guard on any successful request
        if (response.ok) {
          clearRedirectMark();
        }

        return response;
      })
      .catch(function (error) {
        // Network-level error (connection refused, timeout, etc.)
        if (isBackendAsleep(null, error)) {
          console.error('[Recovery] Backend unreachable (' + error.message + '). Redirecting to loader.');
          redirectToLoader();
          // Re-throw so caller's .catch() handler still gets called
          // (they may have user-facing error handling that should run before redirect)
          return Promise.reject(error);
        }

        // Some other error (AbortController, JSON parse, etc.) — pass through
        return Promise.reject(error);
      });
  };

  /* ────────────────────────────────────────────────────────────────────────
     PAGE VISIBILITY API
     If user returns to a tab after extended absence and backend is asleep,
     proactively ping /health to trigger recovery before user interacts.
     ──────────────────────────────────────────────────────────────────────── */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      // Tab became visible — ping backend to ensure it's awake
      // Use a short timeout so it doesn't block anything
      var pingOpts = { method: 'GET', cache: 'no-store' };
      if (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) {
        pingOpts.signal = AbortSignal.timeout(3000);
      }
      fetch(BACKEND_URL + '/health', pingOpts)
        .catch(function () {
          // Health check failed — fetch interceptor will handle redirect
        });
    }
  });

  console.log('[Recovery] Global fetch interceptor installed. Backend:', BACKEND_URL, '| Loader:', LOADER_URL);
})();
</script>
