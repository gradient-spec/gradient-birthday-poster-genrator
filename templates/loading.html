<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starting · Gradient Birthday Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Alegreya+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* ── Design tokens (match base.html) ── */
    :root {
      --bg:           #0B0F14;
      --surface:      #1A2332;
      --border:       #2A3647;
      --accent:       #186275;
      --accent-hover: #1d7a91;
      --accent-glow:  rgba(24, 98, 117, 0.35);
      --text:         #EDEDED;
      --text-secondary: #5B7797;
      --text-muted:   #8295B0;
      --success-text: #7ecfdf;
      --font-heading: 'Playfair Display', Georgia, serif;
      --font-body:    'Alegreya Sans', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 1rem;
      overflow: hidden;
    }

    /* ── Radial ambient glow ── */
    body::before {
      content: '';
      position: fixed;
      top: -180px;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(500px, 80vw, 1000px);
      height: clamp(300px, 50vh, 500px);
      background: radial-gradient(ellipse at center,
        rgba(24, 98, 117, 0.20) 0%,
        rgba(24, 98, 117, 0.06) 50%,
        transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ── */
    .stage {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 0;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: clamp(44px, 6vw, 64px) clamp(40px, 6vw, 72px);
      width: min(480px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      box-shadow:
        0 0 0 1px rgba(24, 98, 117, 0.10),
        0 40px 100px rgba(0, 0, 0, 0.55);
      /* Subtle card glow pulse */
      animation: card-breathe 4s ease-in-out infinite;
    }

    @keyframes card-breathe {
      0%, 100% { box-shadow: 0 0 0 1px rgba(24,98,117,0.10), 0 40px 100px rgba(0,0,0,0.55); }
      50%       { box-shadow: 0 0 0 1px rgba(24,98,117,0.22), 0 40px 100px rgba(0,0,0,0.55), 0 0 60px rgba(24,98,117,0.10); }
    }

    /* ── Logo ── */
    .logo-wrap {
      margin-bottom: 28px;
      position: relative;
    }

    .logo-img {
      height: 52px;
      width: auto;
      display: block;
      animation: logo-pulse 3s ease-in-out infinite;
    }

    /* Glow ring behind the logo */
    .logo-wrap::after {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(24,98,117,0.25) 0%, transparent 70%);
      animation: logo-glow 3s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes logo-pulse {
      0%, 100% { transform: scale(1);    opacity: 1; }
      50%       { transform: scale(1.06); opacity: 0.90; }
    }

    @keyframes logo-glow {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.3); }
    }

    /* ── Title ── */
    .title {
      font-family: var(--font-heading);
      font-size: clamp(1.35rem, 2.5vw, 1.65rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.82rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 36px;
    }

    /* ── Animated progress bar ── */
    .progress-track {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--success-text), var(--accent));
      background-size: 200% 100%;
      animation: progress-slide 2s linear infinite;
      /* width starts at 30% and grows via JS once server responds */
      width: 40%;
    }

    @keyframes progress-slide {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Spinner ring ── */
    .spinner-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2.5px solid rgba(24, 98, 117, 0.18);
      border-top-color: var(--accent);
      border-right-color: var(--success-text);
      animation: spin 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Status message ── */
    .status-msg {
      font-size: 0.95rem;
      color: var(--text-secondary);
      text-align: center;
      min-height: 1.5em;
      transition: opacity 0.4s ease;
      margin-bottom: 12px;
    }

    .status-msg.fade {
      opacity: 0;
    }

    /* ── Dot indicators ── */
    .dots {
      display: flex;
      gap: 7px;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.3;
      animation: dot-bounce 1.5s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot-bounce {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
      40%            { opacity: 1;    transform: scale(1.2); box-shadow: 0 0 6px rgba(24,98,117,0.6); }
    }

    /* ── Cold-start note ── */
    .cold-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(42, 54, 71, 0.6);
      border-radius: 10px;
    }

    .cold-note strong {
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* ── Timeout warning (hidden initially) ── */
    .timeout-warning {
      display: none;
      margin-top: 20px;
      padding: 13px 16px;
      border-radius: 10px;
      background: rgba(164, 203, 235, 0.06);
      border: 1px solid rgba(164, 203, 235, 0.18);
      color: #a4cbeb;
      font-size: 0.85rem;
      text-align: center;
      line-height: 1.6;
      width: 100%;
    }

    .timeout-warning.visible {
      display: block;
      animation: fade-in 0.5s ease;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Success flash (before redirect) ── */
    .success-flash {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      color: var(--success-text);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .success-flash.visible {
      display: flex;
      animation: fade-in 0.3s ease;
    }

    .success-flash svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ── Footer ── */
    .footer {
      margin-top: 32px;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card {
        padding: 36px 24px;
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="stage">

    <div class="card" id="card">

      <!-- Logo -->
      <div class="logo-wrap">
        <img
          class="logo-img"
          src="/static/logo.png"
          alt="Gradient Club"
          onerror="this.style.display='none'"
        >
      </div>

      <!-- Title -->
      <h1 class="title">Birthday Poster Generator</h1>
      <p class="subtitle">Gradient Internal Tools</p>

      <!-- Progress bar -->
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <!-- Spinner -->
      <div class="spinner-wrap">
        <div class="spinner" id="spinner"></div>
      </div>

      <!-- Status message -->
      <p class="status-msg" id="status-msg">Starting Birthday Generator...</p>

      <!-- Dot indicators -->
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <!-- Cold-start note -->
      <div class="cold-note">
        <strong>First launch of the day?</strong><br>
        The server may take up to one minute to start.
      </div>

      <!-- Timeout warning (shown after 90s) -->
      <div class="timeout-warning" id="timeout-warning">
        Server is taking longer than expected.<br>
        Please wait a little longer&hellip;
      </div>

      <!-- Success flash (shown just before redirect) -->
      <div class="success-flash" id="success-flash">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        Server ready &mdash; redirecting&hellip;
      </div>

    </div>

    <p class="footer">&copy; 2026 &middot; GradientClub.in</p>

  </div>

  <script>
    (function () {
      'use strict';

      /* ── Configuration ── */
      var POLL_INTERVAL_MS  = 2000;   // check every 2 seconds
      var TIMEOUT_WARNING_MS = 90000; // show warning after 90 seconds
      var REDIRECT_DELAY_MS  = 600;   // brief pause so user sees the success flash

      /* ── Status messages cycled while waiting ── */
      var MESSAGES = [
        'Starting Birthday Generator...',
        'Waking up the server...',
        'Loading application modules...',
        'Connecting to database...',
        'Preparing dashboard...',
        'Almost there...',
      ];

      /* ── DOM refs ── */
      var statusEl   = document.getElementById('status-msg');
      var warningEl  = document.getElementById('timeout-warning');
      var successEl  = document.getElementById('success-flash');
      var spinnerEl  = document.getElementById('spinner');
      var progressEl = document.getElementById('progress-fill');

      /* ── State ── */
      var msgIndex    = 0;
      var pollTimer   = null;
      var msgTimer    = null;
      var warnTimer   = null;
      var startTime   = Date.now();
      var redirecting = false;

      /* ── Cycle status messages every 5 seconds ── */
      function cycleMessage() {
        /* Fade out */
        statusEl.classList.add('fade');

        setTimeout(function () {
          msgIndex = (msgIndex + 1) % MESSAGES.length;
          statusEl.textContent = MESSAGES[msgIndex];
          /* Fade in */
          statusEl.classList.remove('fade');
        }, 400);
      }

      msgTimer = setInterval(cycleMessage, 5000);

      /* ── Show timeout warning after 90 s ── */
      warnTimer = setTimeout(function () {
        warningEl.classList.add('visible');
      }, TIMEOUT_WARNING_MS);

      /* ── Poll /health ── */
      function poll() {
        if (redirecting) return;

        fetch('/health', {
          method: 'GET',
          cache: 'no-store',
          /* Short timeout per request so a hung connection doesn't block the next poll */
          signal: AbortSignal.timeout ? AbortSignal.timeout(5000) : undefined,
        })
          .then(function (res) {
            if (res.ok) {
              onServerReady();
            }
            /* Non-200: server is up but something is wrong — keep polling */
          })
          .catch(function () {
            /* Network error / server still asleep — keep polling silently */
          });
      }

      /* ── Server is alive ── */
      function onServerReady() {
        redirecting = true;

        /* Stop all timers */
        clearInterval(pollTimer);
        clearInterval(msgTimer);
        clearTimeout(warnTimer);

        /* Show success state */
        statusEl.textContent = 'Server ready!';
        statusEl.style.color = 'var(--success-text)';
        warningEl.classList.remove('visible');
        successEl.classList.add('visible');

        /* Animate progress bar to full width */
        progressEl.style.transition = 'width 0.5s ease';
        progressEl.style.width = '100%';
        progressEl.style.animation = 'none';
        progressEl.style.background = 'linear-gradient(90deg, var(--accent), var(--success-text))';

        /* Stop spinner, show a static complete ring */
        spinnerEl.style.animation = 'none';
        spinnerEl.style.borderColor = 'rgba(24,98,117,0.4)';
        spinnerEl.style.borderTopColor = 'var(--success-text)';
        spinnerEl.style.borderRightColor = 'var(--success-text)';

        /* Redirect after a brief moment so the user sees the success state */
        setTimeout(function () {
          window.location.href = '/login';
        }, REDIRECT_DELAY_MS);
      }

      /* ── Start polling immediately, then every POLL_INTERVAL_MS ── */
      poll();
      pollTimer = setInterval(poll, POLL_INTERVAL_MS);

    })();
  </script>

</body>
</html>
